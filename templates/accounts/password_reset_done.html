<!-- --#-- Password Reset Done Template -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Link Sent - Digital Wallet</title>

    <link rel="icon" type="image/png" href="{% static 'images/Digital_Wallet_Fav_Icon.png' %}">

    <link rel="stylesheet" href="{% static 'css/base_variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="text-align: center;">
            <div class="statement-success-icon">
                {% include '__snippets__/icons/envelope-circle-check.svg' %}
            </div>
            <h1 class="auth-title">Check your inbox</h1>
            <p class="auth-subtitle">If an account exists for that email, a reset link is on its way.</p>
            <div class="auth-links" style="justify-content: center;">
                <a href="{% url 'accounts:login' %}">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
