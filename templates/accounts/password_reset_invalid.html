<!-- --#-- Password Reset Invalid Template -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link - Digital Wallet</title>

    <link rel="icon" type="image/png" href="{% static 'images/Digital_Wallet_Fav_Icon.png' %}">

    <link rel="stylesheet" href="{% static 'css/base_variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="text-align: center;">
            <div class="statement-error-icon">
                {% include '__snippets__/icons/exclamation-circle.svg' %}
            </div>
            <h1 class="auth-title">Link expired</h1>
            <p class="auth-subtitle">This reset link is invalid or has already been used.</p>
            <div class="auth-links" style="justify-content: center;">
                <a href="{% url 'accounts:password_reset_client' %}">Request a new link</a>
            </div>
        </div>
    </div>
</body>
</html>
