{% load static %}

<!-- --#-- Meta & Title -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Secure Digital Wallet Dashboard for managing your finances">
<title>{% block title %}Digital Wallet{% endblock %}</title>

<!-- --#-- Favicon -->
<link rel="icon" type="image/png" href="{% static 'images/Digital_Wallet_Fav_Icon.png' %}">

<!-- --#-- Theme Init (before CSS paint: saved choice, else OS) -->
<script>
    (function () {
        var theme = 'light';
        try {
            theme = localStorage.getItem('theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        try {
            if (localStorage.getItem('sidebar-collapsed') === '1') {
                document.addEventListener('DOMContentLoaded', function () {
                    document.getElementById('app').classList.add('sidebar-collapsed');
                });
            }
        } catch (e) { /* private mode: no persistence */ }
    })();
</script>

<!-- --#-- HTMX -->
<script src="https://unpkg.com/htmx.org@2.0.4"></script>

<!-- --#-- Chart.js Lazy Loader (analytics page only) -->
<script>
    window.chartjsLoaded = false;
    function loadChartJs() {
        return new Promise(function (resolve) {
            if (window.chartjsLoaded) { resolve(); return; }
            if (typeof Chart !== 'undefined') {
                window.chartjsLoaded = true;
                resolve();
                return;
            }
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js';
            s.onload = function () { window.chartjsLoaded = true; resolve(); };
            document.head.appendChild(s);
        });
    }
</script>

<!-- --#-- Modular CSS -->
<link rel="stylesheet" href="{% static 'css/base_variables.css' %}">
<link rel="stylesheet" href="{% static 'css/layout.css' %}">
<link rel="stylesheet" href="{% static 'css/navigation.css' %}">
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
<link rel="stylesheet" href="{% static 'css/utilities.css' %}">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'css/pages.css' %}">
