<!-- --#-- Wallet Status Partial (for HTMX updates) -->
<span class="wallet-status-badge {% if wallet.is_frozen %}frozen{% else %}active{% endif %}">
    {% if wallet.is_frozen %}
        {% include '__snippets__/icons/snowflake.svg' %} Frozen
        <button class="btn btn-sm btn-ghost"
                hx-post="{% url 'operations:unfreeze_wallet' wallet.id %}"
                hx-target="closest .wallet-status-badge"
                hx-swap="outerHTML">
            {% include '__snippets__/icons/unlock.svg' %} Unfreeze
        </button>
    {% else %}
        {% include '__snippets__/icons/check-circle.svg' %} Active
        <button class="btn btn-sm btn-ghost"
                hx-post="{% url 'operations:freeze_wallet' wallet.id %}"
                hx-target="closest .wallet-status-badge"
                hx-swap="outerHTML">
            {% include '__snippets__/icons/lock.svg' %} Freeze
        </button>
    {% endif %}
</span>
