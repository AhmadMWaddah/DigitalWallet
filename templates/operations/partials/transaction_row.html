<!-- --#-- Transaction Row Partial (for HTMX updates) -->
<tr class="flagged-row" id="transaction-row-{{ transaction.id }}">
    <td>#{{ transaction.id }}</td>
    <td>{{ transaction.wallet.client_profile.user.email }}</td>
    <td>
        <span class="transaction-type type-{{ transaction.type|lower }}">
            {{ transaction.get_type_display }}
        </span>
    </td>
    <td class="tx-amount">${{ transaction.amount|floatformat:2 }}</td>
    <td>{{ transaction.metadata.flag_reason|default:"Under review" }}</td>
    <td class="tx-date">{{ transaction.created_at|date:"M d, Y H:i" }}</td>
    <td>
        <span class="badge badge-{{ transaction.status|lower }}">
            {{ transaction.get_status_display }}
        </span>
    </td>
</tr>
