{# --#-- Progress Bar (Polling State) #}
{# Polls every 2 seconds until task completes #}

<div class="statement-progress"
     hx-get="{% url 'wallet:statement_status' task_id %}"
     hx-trigger="every 2s"
     hx-target="#statement-section"
     hx-swap="innerHTML">

    <div class="statement-spinner animate-spin">
        {% include '__snippets__/icons/circle-notch.svg' %}
    </div>

    <div class="progress-bar">
        <div class="progress-fill" style="width: {{ progress|default:10 }}%;"></div>
    </div>

    <p class="progress-label">Generating your statement... please wait.</p>
</div>
