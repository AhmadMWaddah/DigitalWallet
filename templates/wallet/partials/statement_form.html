{# --#-- Statement Request Form (Initial State) #}
{# Form submits to start PDF generation #}

<form class="statement-form"
      hx-post="{% url 'wallet:statement_request' %}"
      hx-target="#statement-section"
      hx-swap="innerHTML"
      hx-indicator=".processing-indicator">

    {% csrf_token %}

    <div class="form-row">
        <div class="form-group">
            <label for="statement-start-date" class="form-label">
                {% include '__snippets__/icons/calendar-alt.svg' %}
                Start Date
            </label>
            <input type="date"
                   id="statement-start-date"
                   name="start_date"
                   required
                   max="{% now 'Y-m-d' %}"
                   class="form-input">
        </div>

        <div class="form-group">
            <label for="statement-end-date" class="form-label">
                {% include '__snippets__/icons/calendar-alt.svg' %}
                End Date
            </label>
            <input type="date"
                   id="statement-end-date"
                   name="end_date"
                   required
                   max="{% now 'Y-m-d' %}"
                   class="form-input">
        </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">
        {% include '__snippets__/icons/file-pdf.svg' %}
        Generate Statement
    </button>
    <span class="processing-indicator">
        {% include '__snippets__/icons/circle-notch.svg' %} Generating...
    </span>
</form>
