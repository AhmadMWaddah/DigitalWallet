{# --#-- Error State #}
{# Shows error message with retry option #}

<div class="statement-error">
    <div class="statement-error-icon">
        {% include '__snippets__/icons/exclamation-circle.svg' %}
    </div>

    <h4 class="mt-0">Generation Failed</h4>
    <p class="text-muted text-sm">{{ error|default:"An unexpected error occurred while generating your statement." }}</p>

    <div class="mt-3">
        <button class="btn btn-outline btn-sm"
                hx-get="{% url 'wallet:statement_form_partial' %}"
                hx-target="#statement-section"
                hx-swap="innerHTML">
            {% include '__snippets__/icons/redo.svg' %}
            Try Again
        </button>
    </div>
</div>
