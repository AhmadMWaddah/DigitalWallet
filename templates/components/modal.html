<!-- --#-- Modal Component -->
<div class="modal-overlay" id="modal-{{ modal_id|default:'default' }}">
    <div class="modal-container" role="dialog" aria-modal="true" aria-label="{{ title|default:'Modal' }}">
        <div class="modal-header">
            <h3 class="modal-title">{% block modal_title %}{{ title|default:"Modal" }}{% endblock %}</h3>
            <button class="modal-close" data-close-modal aria-label="Close">
                {% include '__snippets__/icons/times.svg' %}
            </button>
        </div>

        <div class="modal-body">
            {% block modal_content %}
            {{ content|safe }}
            {% endblock %}
        </div>

        {% block modal_footer %}
        <div class="modal-footer">
            <button class="btn btn-ghost" data-close-modal>Cancel</button>
            {% if confirm_text %}
            <button class="btn btn-primary" id="modal-confirm-btn">{{ confirm_text }}</button>
            {% endif %}
        </div>
        {% endblock %}
    </div>
</div>
