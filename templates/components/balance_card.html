<!-- --#-- Balance Card Component -->
<div class="balance-card">
    <div class="balance-header">
        <h3 class="balance-title">Your Balance</h3>
        <span class="balance-badge {% if wallet.is_frozen %}badge-frozen{% else %}badge-active{% endif %}">
            {% if wallet.is_frozen %}
            {% include '__snippets__/icons/lock.svg' %} Frozen
            {% else %}
            {% include '__snippets__/icons/check.svg' %} Active
            {% endif %}
        </span>
    </div>

    <div class="balance-amount">
        <span class="currency-symbol">$</span>
        <span class="amount-value">{{ wallet.balance|default:"0.00" }}</span>
    </div>

    <div class="balance-footer">
        <span>Wallet #{{ wallet.id }}</span>
        {% if last_updated %}
        <span>Updated {{ last_updated }}</span>
        {% endif %}
    </div>
</div>
